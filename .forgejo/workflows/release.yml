name: Release

# Runs on every merge to main: computes the next SemVer version from
# Conventional Commits since the last tag, bumps the package version, rolls
# the CHANGELOG's [Unreleased] section into a dated release section, commits
# that back to main, tags it, builds the package, and publishes a GitHub
# Release with the build artifacts attached.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Determine next version and update CHANGELOG
        id: version
        run: python3 scripts/release.py

      - name: Commit version bump and changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/alchemy_wallet_client/__init__.py CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build package
        if: steps.version.outputs.skip != 'true'
        run: hatch build

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: dist/*
