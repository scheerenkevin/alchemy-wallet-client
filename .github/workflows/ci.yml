name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-format-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Lint
        run: hatch run lint

      - name: Format check
        run: hatch run format-check

      - name: Test
        run: hatch run test
