[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alchemy-wallet-client"
dynamic = ["version"]
description = "Python client for Alchemy's server-side wallet / account-abstraction stack (Bundler API + Gas Manager API)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kevin Scheeren", email = "kevinscheeren@icloud.com" }]
keywords = ["alchemy", "erc-4337", "account-abstraction", "bundler", "gas-manager", "wallet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/scheerenkevin/alchemy-wallet-client"
Issues = "https://github.com/scheerenkevin/alchemy-wallet-client/issues"

[tool.hatch.version]
path = "src/alchemy_wallet_client/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alchemy_wallet_client"]

[tool.hatch.envs.default]
dependencies = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
]

[tool.hatch.envs.default.scripts]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
test = "pytest {args:tests}"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
